<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
    pointer-events: none;
  }
  .bubble {
    box-sizing: border-box;
    width: calc(100% - 16px);   /* window is 260px; keep inside margins */
    min-height: 72px;
    margin: 8px;
    position: relative;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(38, 38, 46, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    color: #f2f2f4;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 24px;
    bottom: -10px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(38, 38, 46, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: 40px;
    bottom: -20px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(38, 38, 46, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 6px 0;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hint {
    font-size: 12px;
    line-height: 1.4;
    margin: 0;
    color: #c9c9d4;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="bubble">
    <p class="title" id="bubble-title"></p>
    <p class="hint" id="bubble-hint"></p>
  </div>
<script>
  window.__setBubbleText = function (payload) {
    document.getElementById("bubble-title").textContent = (payload && payload.title) || "";
    document.getElementById("bubble-hint").textContent = (payload && payload.hint) || "";
  };
</script>
</body>
</html>
