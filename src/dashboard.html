}

.context-usage-row {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: var(--radius-s);
  background: color-mix(in srgb, var(--idle) 12%, transparent);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--muted);
}

.badge-running {
  background: color-mix(in srgb, var(--running) 12%, transparent);
  color: var(--running);
}

.badge-done {
  background: color-mix(in srgb, var(--done) 12%, transparent);
  color: var(--done);
}

.badge-interrupted {
  background: color-mix(in srgb, var(--interrupted) 12%, transparent);
  color: var(--interrupted);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--idle);
}

.badge-running .dot { background: var(--running); }
.badge-done .dot { background: var(--done); }
.badge-interrupted .dot { background: var(--interrupted); }
.badge-idle .dot { background: var(--idle); }

.source-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: var(--radius-m);
  background: var(--surface-alt);
  color: var(--text-secondary);
  white-space: nowrap;
}

.recovery-badge {
  font-size: 10px;
  padding: 1px 6px;
  border: 1px dashed var(--muted);
  border-radius: var(--radius-s);
  color: var(--muted);
}
.source-badge.source-wsl {
  background: rgba(76, 166, 79, 0.15);
  color: #4ca64f;
}
.source-badge.source-ssh {
  background: rgba(66, 133, 244, 0.15);
  color: #4285f4;
}

.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.focus-unavailable-reason,
.session-action-feedback {
  flex-basis: 100%;
  min-width: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  text-align: right;
  overflow-wrap: anywhere;
}

.card-unfocusable .focus-unavailable-reason,
.card-unfocusable .session-action-feedback {
  text-align: left;
}

.session-action-feedback:empty { display: none; }

.open-folder-button {
  background: var(--surface-alt);
  color: var(--text);
  border-color: var(--border);
}

.mark-read-button {
  background: var(--surface-alt);
  color: var(--text);
  border-color: var(--border);
}

.mark-read-button:hover:not(:disabled) {
  background: var(--accent);
  color: #ffffff;
  border-color: transparent;
}

button {
  min-width: 82px;
  height: 30px;
  border: 1px solid transparent;
  border-radius: var(--radius-s);
  background: var(--accent);
  color: #ffffff;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 10px;
  transition: transform var(--dur-1) var(--ease-out-apple);
}

button:active {
  transform: scale(0.97);
}

button:hover:not(:disabled) { background: var(--accent-hover); }
button:disabled {
  cursor: default;
  opacity: 0.45;
  background: var(--surface-alt);
  color: var(--muted);
  border-color: var(--border);
}

.hide-session-button {
  position: absolute;
  top: 5px;
  right: 8px;
  min-width: 22px;
  width: 22px;
  height: 22px;
  padding: 0;
  border-color: transparent;
  border-radius: var(--radius-s);
  background: transparent;
  color: var(--subtle);
  font-size: 17px;
  font-weight: 500;
  line-height: 20px;
}

.hide-session-button:hover:not(:disabled) {
  background: var(--surface-alt);
  color: var(--text);
}

.hide-session-button:disabled {
  background: transparent;
  color: var(--subtle);
}

.empty {
  height: 100%;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: var(--muted);
  gap: 6px;
  padding: 24px;
}

.empty-title {
  color: var(--text);
  font-weight: 700;
  font-size: 15px;
}

/* Do not push the resume list below a full-height empty-state panel. */
.empty.empty-with-history {
  height: auto;
  min-height: 0;
  padding: 16px 24px;
  margin-bottom: 16px;
}

.empty-hint {
  max-width: 260px;
  line-height: 1.45;
  color: var(--muted);
}

.hidden { display: none !important; }

@media (max-width: 420px) {
  .header { padding: 16px 16px 12px; }
  .content { padding: 12px; }
  .card {
    grid-template-columns: 28px minmax(0, 1fr);
  }
  .actions {
    grid-column: 2;
    justify-content: flex-start;
  }
}
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-row">
        <h1 id="title">Sessions</h1>
        <span id="count" class="count"></span>
        <div id="viewSwitch" class="view-switch" role="tablist">
          <button type="button" id="viewSessionsTab" class="view-switch-tab is-active" role="tab" aria-selected="true">Sessions</button>
          <button type="button" id="viewTrellisTab" class="view-switch-tab" role="tab" aria-selected="false">Trellis</button>
        </div>
      </div>
      <div id="quickBanner" class="quick-banner" role="status" aria-live="polite" hidden></div>
      <div id="sessionsHeaderExtras">
        <div id="quotaSummary" class="quota-summary" hidden></div>
        <div id="trellisPanel" class="trellis-panel" hidden></div>
      </div>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
    <main id="trellisView" class="content trellis-view" hidden></main>
  </div>
  <div id="trellisDetailOverlay" class="trellis-detail-overlay" role="dialog" hidden></div>
  <script src="./session-focus-unavailable.js"></script>
  <script src="./dashboard-trellis-panel.js"></script>
  <script src="./trellis-doc-renderer.js"></script>
  <script src="./dashboard-renderer.js"></script>
</body>
</html>
