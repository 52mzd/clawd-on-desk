<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:">
<title>Sessions</title>
<style>
* { box-sizing: border-box; }

:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-alt: #ececef;
  --text: #18181b;
  --muted: #6b6b70;
  --subtle: #9b9ba0;
  --border: rgba(0, 0, 0, 0.08);
  --row-border: rgba(0, 0, 0, 0.06);
  --accent: #d97757;
  --accent-hover: #c4684a;
  --running: #16803c;
  --done: #2563eb;
  --interrupted: #b45309;
  --idle: #71717a;
  --scroll-thumb: rgba(0, 0, 0, 0.15);
  --scroll-thumb-hover: rgba(0, 0, 0, 0.25);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1f;
    --surface: #232327;
    --surface-alt: #18181b;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --subtle: #71717a;
    --border: rgba(255, 255, 255, 0.08);
    --row-border: rgba(255, 255, 255, 0.06);
    --running: #22c55e;
    --done: #60a5fa;
    --interrupted: #f59e0b;
    --idle: #a1a1aa;
    --scroll-thumb: rgba(255, 255, 255, 0.1);
    --scroll-thumb-hover: rgba(255, 255, 255, 0.2);
  }
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body { user-select: none; }

.app {
  display: flex;
  flex-direction: column;
  /* 100% (zoom-aware), not viewport units — see settings.css .app for why. */
  height: 100%;
  min-width: 0;
}

.header {
  flex: 0 0 auto;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: 0;
}

.count {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

/* View switch (Sessions / Trellis) in the header: quiet segmented
   controls, not primary CTAs — the page's primary actions stay in the
   content area. */
.view-switch {
  display: inline-flex;
  gap: 2px;
  margin-left: auto;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-alt);
}

.view-switch-tab {
  min-width: 0;
  height: 24px;
  padding: 0 12px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.view-switch-tab:hover:not(.is-active) {
  color: var(--text);
}

.view-switch-tab.is-active {
  background: var(--surface);
  color: var(--text);
}

/* The manual Kimi refresh lives inside the Kimi quota section header, next to
   the data it reloads - a quiet ghost icon button, not a header-level CTA. */
.quota-section-titlebar {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.quota-section-titlebar .quota-section-header {
  flex: 0 0 auto;
}

.quota-refresh-feedback {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quota-refresh-feedback[hidden] {
  display: none;
}

.quota-refresh-feedback.error {
  color: var(--interrupted);
}

.quota-refresh-button {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 22px;
  margin-left: auto;
  padding: 0 8px;
  border: none;
  border-radius: 6px;
  color: var(--id-kimi-outer);
  background: color-mix(in srgb, var(--id-kimi-outer) 12%, transparent);
  font: inherit;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
}

.quota-refresh-button:hover:not(:disabled) {
  background: color-mix(in srgb, var(--id-kimi-outer) 22%, transparent);
}

@media (prefers-color-scheme: dark) {
  .quota-refresh-button {
    background: color-mix(in srgb, var(--id-kimi-outer) 22%, transparent);
  }

  .quota-refresh-button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--id-kimi-outer) 34%, transparent);
  }
}

.quota-refresh-button:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--id-kimi-outer) 55%, white);
  outline-offset: 1px;
}

.quota-refresh-button:disabled {
  cursor: default;
  opacity: 0.45;
}

.quota-refresh-icon {
  display: inline-block;
  font-size: 12px;
  line-height: 1;
}

.quota-refresh-label {
  line-height: 1;
}

.quota-refresh-button.is-refreshing .quota-refresh-icon {
  animation: quota-refresh-spin 0.8s linear infinite;
}

@keyframes quota-refresh-spin {
  to { transform: rotate(360deg); }
}

.quota-empty-hint {
  color: var(--muted);
  font-size: 11px;
}

/* Trellis tasks panel: a read-only view of the per-session trellis bindings
   riding the snapshot. Phase badge hues mirror the HUD chips
   (session-hud.html .trellis-plan…) so one phase answers with the same
   color on both surfaces. */
.trellis-panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 12px;
}

/* Author `display` overrides the UA rule for [hidden], so hidden needs its
   own explicit override — same pattern as .quick-banner[hidden] above. */
.trellis-panel[hidden] {
  display: none;
}

.trellis-panel-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
}

.trellis-task-row {
  border-radius: 8px;
  transition: background-color 0.12s ease, transform 0.12s ease;
}
.trellis-task-row:hover, .trellis-archive-row:hover {
  background: color-mix(in srgb, #7aa2f7 8%, transparent);
  transform: translateX(2px);
}
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 8px;
  border: 1px solid var(--row-border);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
}

.trellis-task-row:hover {
  background: var(--surface-alt);
  transform: translateX(2px);
}

.trellis-task-main {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.trellis-task-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}

.trellis-phase-badge {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 999px;
}

.trellis-phase-badge.phase-plan { background: rgba(59, 130, 246, 0.13); color: #2563eb; }
.trellis-phase-badge.phase-execute { background: rgba(22, 163, 74, 0.13); color: #16a34a; }
.trellis-phase-badge.phase-check { background: rgba(147, 51, 234, 0.13); color: #9333ea; }
.trellis-phase-badge.phase-finish { background: rgba(245, 158, 11, 0.15); color: #b45309; }
.trellis-phase-badge.phase-done { background: rgba(107, 114, 128, 0.13); color: #52525b; }

@media (prefers-color-scheme: dark) {
  .trellis-phase-badge.phase-plan { background: rgba(59, 130, 246, 0.20); color: #60a5fa; }
  .trellis-phase-badge.phase-execute { background: rgba(22, 163, 74, 0.20); color: #4ade80; }
  .trellis-phase-badge.phase-check { background: rgba(147, 51, 234, 0.20); color: #c084fc; }
  .trellis-phase-badge.phase-finish { background: rgba(245, 158, 11, 0.20); color: #fbbf24; }
  .trellis-phase-badge.phase-done { background: rgba(107, 114, 128, 0.20); color: #a1a1aa; }
}

.trellis-task-progress {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.trellis-task-count {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--subtle);
}

.trellis-task-sessions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.trellis-session-chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 11px;
  padding: 3px 8px;
  cursor: pointer;
}

.trellis-session-chip:hover {
  border-color: var(--accent);
}

.trellis-session-chip-unfocusable {
  color: var(--subtle);
  cursor: default;
}

.trellis-session-chip-unfocusable:hover {
  border-color: var(--border);
}

/* Row-tail detail button (ⓘ): opens the task-detail overlay card. */
.trellis-task-detail-btn {
  flex: 0 0 auto;
  margin-left: auto;
  border: none;
  background: transparent;
  color: var(--subtle);
  font-size: 13px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-task-detail-btn:hover {
  background: rgba(59, 130, 246, 0.12);
  color: var(--text);
}

/* Parent/child grouping: a row with live children becomes a group header
   (stronger border, muted fill); child rows indent under it. Depth beyond
   the first level only indents further. */
.trellis-task-row-group {
  border-color: color-mix(in srgb, var(--accent, #2563eb) 35%, var(--row-border));
  background: color-mix(in srgb, var(--accent, #2563eb) 5%, var(--surface));
}

.trellis-task-row-child {
  margin-left: 18px;
}

.trellis-task-group-summary {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* Collapsed "Archived" section at the panel's bottom: a header row with
   caret, label and an explicit refresh button; expanded rows carry title +
   completed date + duration and open the shared detail overlay. */
.trellis-archive-section {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.trellis-archive-header {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 4px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-archive-header:hover {
  color: var(--text);
  background: var(--surface-alt);
}

.trellis-archive-caret {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 1;
}

.trellis-archive-label {
  line-height: 1;
}

.trellis-archive-refresh {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  color: var(--subtle);
  font-size: 12px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-archive-refresh:hover:not(:disabled) {
  background: rgba(59, 130, 246, 0.12);
  color: var(--text);
}

.trellis-archive-refresh:disabled {
  cursor: default;
  opacity: 0.45;
}

.trellis-archive-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}

/* Independent Trellis view: a second scrolling main under the same header.
   The sessions main keeps its id; both share .content styles. */
.trellis-view[hidden] {
  display: none;
}

.trellis-view-section {
  margin: 0 0 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.trellis-view-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 0 2px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Root rows: path + tail remove button; quiet like the archive rows. */
.trellis-root-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 6px 10px;
  border: 1px solid var(--row-border);
  border-radius: 8px;
  background: var(--surface);
}

.trellis-root-path {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}

.trellis-root-remove {
  min-width: 0;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
}

.trellis-root-remove:hover:not(:disabled) {
  color: var(--text);
}

.trellis-view-empty {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.trellis-view-add-root {
  align-self: flex-start;
  min-width: 0;
  height: 26px;
  padding: 0 10px;
  font-size: 11px;
}

.trellis-view-error {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--interrupted);
  font-size: 11px;
}

.trellis-view-retry {
  min-width: 0;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 11px;
  cursor: pointer;
}

/* Project filter chips: "All projects" + one per registered root, labeled
   by the disambiguated basename with its live-task count. Empty roots
   (no live, no archived tasks) dim but stay clickable — seeing the empty
   view is exactly what clicking them is for. */
.trellis-filter-section {
  margin: 0 0 14px;
}

.trellis-filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.trellis-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--muted);
  font-size: 11px;
  line-height: 1;
  padding: 5px 10px;
  cursor: pointer;
}

.trellis-filter-chip:hover,
.trellis-filter-chip.is-active {
  border-color: var(--accent);
  color: var(--text);
}

.trellis-filter-chip-empty {
  opacity: 0.55;
}

.trellis-filter-chip-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.trellis-filter-count {
  font-variant-numeric: tabular-nums;
  color: var(--subtle);
}

.trellis-filter-chip.is-active .trellis-filter-count {
  color: var(--muted);
}

/* Cross-project origin tag on task rows (merged "all" view only). */
.trellis-task-project {
  flex: 0 0 auto;
  max-width: 40%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--subtle);
  font-size: 10px;
}

.trellis-archive-month {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 3px 8px;
  border: none;
  background: transparent;
  color: #b8bcc8;
  font-size: 11px;
  cursor: pointer;
  text-align: left;
}
.trellis-archive-month:hover { background: rgba(127, 127, 127, 0.12); }
.trellis-archive-month-label { user-select: none; }

.trellis-archive-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 5px 8px;
  border: 1px solid var(--row-border);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
}

.trellis-archive-row:hover {
  background: var(--surface-alt);
}

.trellis-archive-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.trellis-archive-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--muted);
}

.trellis-archive-meta {
  flex: 0 0 auto;
  display: inline-flex;
  gap: 8px;
  font-size: 10px;
  color: var(--subtle);
  font-variant-numeric: tabular-nums;
}

.trellis-archive-empty {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.45;
}

.trellis-archive-retry {
  align-self: flex-start;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 11px;
  padding: 3px 10px;
  cursor: pointer;
}

/* Task tree (independent view): rows nest inside .trellis-tree-children
   containers whose left border doubles as the connector line — pure CSS
   indent, no tree component. The caret column stays a fixed width so
   branch and leaf rows align. Connectors use a gradient + glow accent so
   depth reads at a glance; deeper levels shift hue slightly. */
.trellis-tree-children {
  margin-left: 14px;
  padding-left: 12px;
  position: relative;
  border-left: 1px solid color-mix(in srgb, var(--muted, #6b7280) 35%, transparent);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color 0.15s ease;
}
.trellis-tree-children::before {
  /* Soft glow bead at the top of each connector, fading downward —
     visual depth cue without adding DOM. */
  content: "";
  position: absolute;
  left: -2.5px;
  top: 0;
  width: 4px;
  height: 26px;
  border-radius: 2px;
  background: linear-gradient(
    to bottom,
    color-mix(in srgb, #7aa2f7 45%, transparent),
    transparent
  );
  pointer-events: none;
}

.trellis-task-row[data-depth], .trellis-archive-row[data-depth] {
  border-radius: 8px;
  transition: background-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}
.trellis-task-row[data-depth="1"], .trellis-archive-row[data-depth="1"] { box-shadow: inset 2px 0 0 -1px color-mix(in srgb, #7aa2f7 30%, transparent); }
.trellis-task-row[data-depth="2"], .trellis-archive-row[data-depth="2"] { box-shadow: inset 2px 0 0 -1px color-mix(in srgb, #9d7cd8 30%, transparent); }
.trellis-task-row[data-depth="3"], .trellis-archive-row[data-depth="3"] { box-shadow: inset 2px 0 0 -1px color-mix(in srgb, #e0af68 30%, transparent); }
.trellis-task-row[data-depth="4"], .trellis-archive-row[data-depth="4"] { box-shadow: inset 2px 0 0 -1px color-mix(in srgb, #e78a4e 30%, transparent); }
.trellis-task-row[data-depth="5"], .trellis-archive-row[data-depth="5"] { box-shadow: inset 2px 0 0 -1px color-mix(in srgb, #d4576e 30%, transparent); }

.trellis-tree-children {
  animation: trellis-tree-unfold 0.16s ease;
}
@keyframes trellis-tree-unfold {
  from { opacity: 0.35; transform: translateY(-2px); }
  to { opacity: 1; transform: translateY(0); }
}

.trellis-tree-caret {
  flex: 0 0 auto;
  width: 16px;
  border: none;
  background: transparent;
  color: var(--subtle);
  font-size: 10px;
  line-height: 1;
  padding: 2px 0;
  cursor: pointer;
  transition: color 0.12s ease, transform 0.12s ease;
}

.trellis-tree-caret:hover {
  color: #7aa2f7;
  transform: scale(1.25);
}

.trellis-tree-caret[data-open="true"] {
  color: #7aa2f7;
}

.trellis-tree-caret-spacer {
  flex: 0 0 auto;
  width: 16px;
}

/* Expand-all / collapse-all text buttons in the section title rows. */
.trellis-tree-tool {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--muted);
  font-size: 10px;
  line-height: 1;
  padding: 4px 8px;
  cursor: pointer;
}

.trellis-tree-tool:hover {
  color: var(--text);
  border-color: var(--accent);
}

/* Task detail: a modal card inside the Dashboard window. Clicks on the
   dimmed backdrop (not the card) and ESC close it. Same palette as the
   panel above; the card scrolls independently of the page. */
.trellis-detail-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(15, 15, 20, 0.45);
}

/* Author display overrides the UA [hidden] rule — same pattern as the
   trellis panel above. */
.trellis-detail-overlay[hidden] {
  display: none;
}

.trellis-detail-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  /* v5-a: near-fullscreen doc cards. Percentages chain off the fullscreen
     overlay (never bare viewport units — dashboard text-zoom cannot
     compensate vw/vh, see settings-renderer-browser-env test). Small
     dashboard windows fall back to the legacy compact card below. */
  width: calc(100% - 48px);
  max-width: 880px;
  height: calc(100% - 64px);
  max-height: 760px;
  overflow-y: auto;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
  /* v5-a entrance: pop-in with a slight settle. One-shot per element —
     signature-guarded rerenders skip replaceChildren, so no flicker;
     replaceChildren replays it, which is the desired "reopened" feel. */
  animation: trellis-card-pop-in 0.26s cubic-bezier(0.34, 1.3, 0.5, 1) both;
}

@keyframes trellis-card-pop-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Overlay backdrop fade matches the card pop-in. */
.trellis-detail-overlay:not([hidden]) {
  animation: trellis-overlay-fade-in 0.18s ease-out both;
}

@keyframes trellis-overlay-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* v5-a symmetric close: the overlay plays a quick fade/scale-out before
   hidden lands. Driven by the .is-closing class the renderer toggles;
   reduced-motion skips it (CSS gate) and the renderer always hides
   unconditionally, so a missed animationend can never strand the overlay. */
.trellis-detail-overlay.is-closing:not([hidden]) {
  animation: trellis-overlay-fade-out 0.14s ease-in both;
  pointer-events: none;
}

.trellis-detail-overlay.is-closing:not([hidden]) .trellis-detail-card {
  animation: trellis-card-pop-out 0.14s ease-in both;
}

@keyframes trellis-overlay-fade-out {
  from { opacity: 1; }
  to { opacity: 0; }
}

@keyframes trellis-card-pop-out {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: translateY(8px) scale(0.94); }
}

@media (prefers-reduced-motion: reduce) {
  .trellis-detail-card,
  .trellis-detail-overlay:not([hidden]),
  .trellis-detail-overlay.is-closing:not([hidden]),
  .trellis-detail-overlay.is-closing:not([hidden]) .trellis-detail-card {
    animation: none;
  }
}

/* Provider identity + severity are mirrored from quota-ring.html so a bar and
   an Orbit coin answer "which provider / which window / which state" with the
   same color. The hue follows the LOGICAL window: the 5h half wears the
   provider's outer/rolling hue, the Weekly half the inner/weekly hue — the
   same assignment the coins use. test/quota-palette.test.js pins the mirror,
   so these values are not editable here alone — quota-ring.html carries the
   reasoning for each hue and is where a change starts. Watch out for --done
   above: it is a similar blue, but it means "session finished", not a quota
   window, and a palette sweep must leave it alone. */
:root {
  --id-claude-outer: #2dd4bf;
  --id-claude-inner: #6489f7;
  --id-codex-outer: #a78bfa;
  --id-codex-inner: #22d3ee;
  --id-antigravity-outer: #38bdf8;
  --id-antigravity-inner: #6366f1;
  --id-kimi-outer: #3b93f7;
  --id-kimi-inner: #e27aeb;
  --sev-warn: #fbbf24;
  --sev-hot: #f87171;
}

.quota-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
  transition: width 0.2s ease;
}

.quota-bar-fill.pv-claudeQuota.rg-outer { background: var(--id-claude-outer); }
.quota-bar-fill.pv-claudeQuota.rg-inner { background: var(--id-claude-inner); }
.quota-bar-fill.pv-codexQuota.rg-outer { background: var(--id-codex-outer); }
.quota-bar-fill.pv-codexQuota.rg-inner { background: var(--id-codex-inner); }
/* Spark is Codex-family quota shown only here, so it wears the Codex hues. */
.quota-bar-fill.pv-codexSparkQuota.rg-outer { background: var(--id-codex-outer); }
.quota-bar-fill.pv-codexSparkQuota.rg-inner { background: var(--id-codex-inner); }
.quota-bar-fill.pv-antigravityQuota.rg-outer { background: var(--id-antigravity-outer); }
.quota-bar-fill.pv-antigravityQuota.rg-inner { background: var(--id-antigravity-inner); }
.quota-bar-fill.pv-kimiQuota.rg-outer { background: var(--id-kimi-outer); }
.quota-bar-fill.pv-kimiQuota.rg-inner { background: var(--id-kimi-inner); }
/* Severity overrides identity exactly like on the coins: warn 60, hot 85. */
.quota-bar-fill.sev-warn { background: var(--sev-warn); }
.quota-bar-fill.sev-hot { background: var(--sev-hot); }

  align-items: flex-end;
  gap: 4px;
}

.session-history-feedback {
  color: var(--muted);
  font-size: 11px;
}

.session-history-feedback:empty { display: none; }

.automation-orphans-hint {
  margin: -2px 2px 8px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

.automation-orphan-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.automation-orphan-main {
  min-width: 0;
}

.automation-orphan-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
}

.automation-orphan-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.path {
  color: var(--subtle);
}

.event-row {
  color: var(--muted);
}

.model-row {
  color: var(--muted);
}

.context-usage-row {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--idle);
}

.badge-running .dot { background: var(--running); }
.badge-done .dot { background: var(--done); }
.badge-interrupted .dot { background: var(--interrupted); }
.badge-idle .dot { background: var(--idle); }

.source-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  background: var(--surface-alt);
  color: var(--text-secondary);
  white-space: nowrap;
}

.recovery-badge {
  font-size: 10px;
  padding: 1px 6px;
  border: 1px dashed var(--muted);
  border-radius: 6px;
  color: var(--muted);
}
.source-badge.source-wsl {
  background: rgba(76, 166, 79, 0.15);
  color: #4ca64f;
}
.source-badge.source-ssh {
  background: rgba(66, 133, 244, 0.15);
  color: #4285f4;
}

.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.focus-unavailable-reason,
.session-action-feedback {
  flex-basis: 100%;
  min-width: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  text-align: right;
  overflow-wrap: anywhere;
}

.card-unfocusable .focus-unavailable-reason,
.card-unfocusable .session-action-feedback {
  text-align: left;
}

.session-action-feedback:empty { display: none; }

.open-folder-button {
  background: var(--surface-alt);
  color: var(--text);
  border-color: var(--border);
}

.mark-read-button {
  background: var(--surface-alt);
  color: var(--text);
  border-color: var(--border);
}

.mark-read-button:hover:not(:disabled) {
  background: var(--accent);
  color: #ffffff;
  border-color: transparent;
}

button {
  min-width: 82px;
  height: 30px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: var(--accent);
  color: #ffffff;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 10px;
}

button:hover:not(:disabled) { background: var(--accent-hover); }
button:disabled {
  cursor: default;
  opacity: 0.45;
  background: var(--surface-alt);
  color: var(--muted);
  border-color: var(--border);
}

.hide-session-button {
  position: absolute;
  top: 5px;
  right: 8px;
  min-width: 22px;
  width: 22px;
  height: 22px;
  padding: 0;
  border-color: transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--subtle);
  font-size: 17px;
  font-weight: 500;
  line-height: 20px;
}

.hide-session-button:hover:not(:disabled) {
  background: var(--surface-alt);
  color: var(--text);
}

.hide-session-button:disabled {
  background: transparent;
  color: var(--subtle);
}

.empty {
  height: 100%;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: var(--muted);
  gap: 6px;
  padding: 24px;
}

.empty-title {
  color: var(--text);
  font-weight: 700;
  font-size: 15px;
}

/* Do not push the resume list below a full-height empty-state panel. */
.empty.empty-with-history {
  height: auto;
  min-height: 0;
  padding: 16px 24px;
  margin-bottom: 16px;
}

.empty-hint {
  max-width: 260px;
  line-height: 1.45;
  color: var(--muted);
}

.hidden { display: none !important; }

@media (max-width: 420px) {
  .header { padding: 16px 16px 12px; }
  .content { padding: 12px; }
  .card {
    grid-template-columns: 28px minmax(0, 1fr);
  }
  .actions {
    grid-column: 2;
    justify-content: flex-start;
  }
}
</style>
</head>

          <button type="button" id="viewSessionsTab" class="view-switch-tab is-active" role="tab" aria-selected="true">Sessions</button>
          <button type="button" id="viewTrellisTab" class="view-switch-tab" role="tab" aria-selected="false">Trellis</button>
        </div>
      </div>
      <div id="quickBanner" class="quick-banner" role="status" aria-live="polite" hidden></div>

        <div id="quotaSummary" class="quota-summary" hidden></div>
        <div id="trellisPanel" class="trellis-panel" hidden></div>
      </div>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
    <main id="trellisView" class="content trellis-view" hidden></main>
  </div>
  <div id="trellisDetailOverlay" class="trellis-detail-overlay" role="dialog" hidden></div>
  <div id="trellisSpecOverlay" class="trellis-detail-overlay" role="dialog" hidden></div>
  <div id="trellisNetworkOverlay" class="trellis-detail-overlay" role="dialog" hidden></div>
  <script src="./session-focus-unavailable.js"></script>
  <script src="./dashboard-trellis-panel.js"></script>
  <script src="./trellis-doc-renderer.js"></script>
  <script src="./dashboard-renderer.js"></script>
</body>
