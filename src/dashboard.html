<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:">
<title>Sessions</title>
<style>
* { box-sizing: border-box; }

:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-alt: #ececef;
  --text: #18181b;
  --muted: #6b6b70;
  --subtle: #9b9ba0;
  --border: rgba(0, 0, 0, 0.08);
  --row-border: rgba(0, 0, 0, 0.06);
  --accent: #d97757;
  --accent-hover: #c4684a;
  --running: #16803c;
  --done: #2563eb;
  --interrupted: #b45309;
  --idle: #71717a;
  --scroll-thumb: rgba(0, 0, 0, 0.15);
  --scroll-thumb-hover: rgba(0, 0, 0, 0.25);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1f;
    --surface: #232327;
    --surface-alt: #18181b;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --subtle: #71717a;
    --border: rgba(255, 255, 255, 0.08);
    --row-border: rgba(255, 255, 255, 0.06);
    --running: #22c55e;
    --done: #60a5fa;
    --interrupted: #f59e0b;
    --idle: #a1a1aa;
    --scroll-thumb: rgba(255, 255, 255, 0.1);
    --scroll-thumb-hover: rgba(255, 255, 255, 0.2);
  }
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body { user-select: none; }

.app {
  display: flex;
  flex-direction: column;
  /* 100% (zoom-aware), not viewport units — see settings.css .app for why. */
  height: 100%;
  min-width: 0;
}

.header {
  flex: 0 0 auto;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: 0;
}

.count {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

/* The manual Kimi refresh lives inside the Kimi quota section header, next to
   the data it reloads - a quiet ghost icon button, not a header-level CTA. */
.quota-section-titlebar {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.quota-section-titlebar .quota-section-header {
  flex: 0 0 auto;
}

.quota-refresh-feedback {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quota-refresh-feedback[hidden] {
  display: none;
}

.quota-refresh-feedback.error {
  color: var(--interrupted);
}

.quota-refresh-button {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 22px;
  margin-left: auto;
  padding: 0 8px;
  border: none;
  border-radius: 6px;
  color: var(--id-kimi-outer);
  background: color-mix(in srgb, var(--id-kimi-outer) 12%, transparent);
  font: inherit;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
}

.quota-refresh-button:hover:not(:disabled) {
  background: color-mix(in srgb, var(--id-kimi-outer) 22%, transparent);
}

@media (prefers-color-scheme: dark) {
  .quota-refresh-button {
    background: color-mix(in srgb, var(--id-kimi-outer) 22%, transparent);
  }

  .quota-refresh-button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--id-kimi-outer) 34%, transparent);
  }
}

.quota-refresh-button:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--id-kimi-outer) 55%, white);
  outline-offset: 1px;
}

.quota-refresh-button:disabled {
  cursor: default;
  opacity: 0.45;
}

.quota-refresh-icon {
  display: inline-block;
  font-size: 12px;
  line-height: 1;
}

.quota-refresh-label {
  line-height: 1;
}

.quota-refresh-button.is-refreshing .quota-refresh-icon {
  animation: quota-refresh-spin 0.8s linear infinite;
}

@keyframes quota-refresh-spin {
  to { transform: rotate(360deg); }
}

.quota-empty-hint {
  color: var(--muted);
  font-size: 11px;
}

/* Trellis tasks panel: a read-only view of the per-session trellis bindings
   riding the snapshot. Phase badge hues mirror the HUD chips
   (session-hud.html .trellis-plan…) so one phase answers with the same
   color on both surfaces. */
.trellis-panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 12px;
}

/* Author `display` overrides the UA rule for [hidden], so hidden needs its
   own explicit override — same pattern as .quick-banner[hidden] above. */
.trellis-panel[hidden] {
  display: none;
}

.trellis-panel-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
}

.trellis-task-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 8px;
  border: 1px solid var(--row-border);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
}

.trellis-task-row:hover {
  background: var(--surface-alt);
}

.trellis-task-main {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.trellis-task-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}

.trellis-phase-badge {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 999px;
}

.trellis-phase-badge.phase-plan { background: rgba(59, 130, 246, 0.13); color: #2563eb; }
.trellis-phase-badge.phase-execute { background: rgba(22, 163, 74, 0.13); color: #16a34a; }
.trellis-phase-badge.phase-check { background: rgba(147, 51, 234, 0.13); color: #9333ea; }
.trellis-phase-badge.phase-finish { background: rgba(245, 158, 11, 0.15); color: #b45309; }
.trellis-phase-badge.phase-done { background: rgba(107, 114, 128, 0.13); color: #52525b; }

@media (prefers-color-scheme: dark) {
  .trellis-phase-badge.phase-plan { background: rgba(59, 130, 246, 0.20); color: #60a5fa; }
  .trellis-phase-badge.phase-execute { background: rgba(22, 163, 74, 0.20); color: #4ade80; }
  .trellis-phase-badge.phase-check { background: rgba(147, 51, 234, 0.20); color: #c084fc; }
  .trellis-phase-badge.phase-finish { background: rgba(245, 158, 11, 0.20); color: #fbbf24; }
  .trellis-phase-badge.phase-done { background: rgba(107, 114, 128, 0.20); color: #a1a1aa; }
}

.trellis-task-progress {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.trellis-task-count {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--subtle);
}

.trellis-task-sessions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.trellis-session-chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 11px;
  padding: 3px 8px;
  cursor: pointer;
}

.trellis-session-chip:hover {
  border-color: var(--accent);
}

.trellis-session-chip-unfocusable {
  color: var(--subtle);
  cursor: default;
}

.trellis-session-chip-unfocusable:hover {
  border-color: var(--border);
}

/* Row-tail detail button (ⓘ): opens the task-detail overlay card. */
.trellis-task-detail-btn {
  flex: 0 0 auto;
  margin-left: auto;
  border: none;
  background: transparent;
  color: var(--subtle);
  font-size: 13px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-task-detail-btn:hover {
  background: rgba(59, 130, 246, 0.12);
  color: var(--text);
}

/* Parent/child grouping: a row with live children becomes a group header
   (stronger border, muted fill); child rows indent under it. Depth beyond
   the first level only indents further. */
.trellis-task-row-group {
  border-color: color-mix(in srgb, var(--accent, #2563eb) 35%, var(--row-border));
  background: color-mix(in srgb, var(--accent, #2563eb) 5%, var(--surface));
}

.trellis-task-row-child {
  margin-left: 18px;
}

.trellis-task-group-summary {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* Collapsed "Archived" section at the panel's bottom: a header row with
   caret, label and an explicit refresh button; expanded rows carry title +
   completed date + duration and open the shared detail overlay. */
.trellis-archive-section {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.trellis-archive-header {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 4px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-archive-header:hover {
  color: var(--text);
  background: var(--surface-alt);
}

.trellis-archive-caret {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 1;
}

.trellis-archive-label {
  line-height: 1;
}

.trellis-archive-refresh {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  color: var(--subtle);
  font-size: 12px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-archive-refresh:hover:not(:disabled) {
  background: rgba(59, 130, 246, 0.12);
  color: var(--text);
}

.trellis-archive-refresh:disabled {
  cursor: default;
  opacity: 0.45;
}

.trellis-archive-list {
  /* The panel lives in the header (outside the page scroll area), so the
     expanded archive list must scroll inside a fixed-height box instead of
     stretching the header past the window. */
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}

.trellis-archive-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 5px 8px;
  border: 1px solid var(--row-border);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
}

.trellis-archive-row:hover {
  background: var(--surface-alt);
}

.trellis-archive-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.trellis-archive-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--muted);
}

.trellis-archive-meta {
  flex: 0 0 auto;
  display: inline-flex;
  gap: 8px;
  font-size: 10px;
  color: var(--subtle);
  font-variant-numeric: tabular-nums;
}

.trellis-archive-empty {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.45;
}

.trellis-archive-retry {
  align-self: flex-start;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--text);
  font-size: 11px;
  padding: 3px 10px;
  cursor: pointer;
}

/* Task detail: a modal card inside the Dashboard window. Clicks on the
   dimmed backdrop (not the card) and ESC close it. Same palette as the
   panel above; the card scrolls independently of the page. */
.trellis-detail-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(15, 15, 20, 0.45);
}

/* Author display overrides the UA [hidden] rule — same pattern as the
   trellis panel above. */
.trellis-detail-overlay[hidden] {
  display: none;
}

.trellis-detail-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(420px, 100%);
  max-height: min(520px, 100%);
  overflow-y: auto;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
}

.trellis-detail-header {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.trellis-detail-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  flex: 1 1 auto;
  min-width: 0;
}

.trellis-detail-title {
  margin: 0;
  font-size: 15px;
  line-height: 1.3;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.trellis-detail-archived-badge {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 999px;
  background: rgba(107, 114, 128, 0.13);
  color: #52525b;
}

.trellis-detail-close {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  line-height: 1;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}

.trellis-detail-close:hover {
  background: var(--surface-alt);
  color: var(--text);
}

.trellis-detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.trellis-detail-meta-item {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.trellis-detail-progress {
  height: 6px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}

.trellis-detail-progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--done);
  transition: width 0.2s ease;
}

.trellis-detail-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.trellis-detail-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
}

.trellis-detail-checklist {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.trellis-detail-check-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 3px 4px;
  border-radius: 6px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.trellis-detail-check-box {
  flex: 0 0 auto;
  color: var(--subtle);
  line-height: 1.4;
}

.trellis-detail-check-item-done .trellis-detail-check-box {
  color: var(--done);
}

.trellis-detail-check-item-done .trellis-detail-check-text {
  color: var(--muted);
}

.trellis-detail-empty {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.quota-summary {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}

.quota-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quota-section + .quota-section {
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.quota-section-header {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
}

.quota-group-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.quota-group-header {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
}

.quota-halves {
  display: flex;
  gap: 14px;
}

.quota-half {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.quota-label-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-size: 10px;
}

.quota-label {
  color: var(--muted);
}

.quota-percent {
  color: var(--subtle);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quota-bar-track {
  height: 5px;
  border-radius: 3px;
  background: var(--surface-alt);
  overflow: hidden;
}

/* Provider identity + severity are mirrored from quota-ring.html so a bar and
   an Orbit coin answer "which provider / which window / which state" with the
   same color. The hue follows the LOGICAL window: the 5h half wears the
   provider's outer/rolling hue, the Weekly half the inner/weekly hue — the
   same assignment the coins use. test/quota-palette.test.js pins the mirror,
   so these values are not editable here alone — quota-ring.html carries the
   reasoning for each hue and is where a change starts. Watch out for --done
   above: it is a similar blue, but it means "session finished", not a quota
   window, and a palette sweep must leave it alone. */
:root {
  --id-claude-outer: #2dd4bf;
  --id-claude-inner: #6489f7;
  --id-codex-outer: #a78bfa;
  --id-codex-inner: #22d3ee;
  --id-antigravity-outer: #38bdf8;
  --id-antigravity-inner: #6366f1;
  --id-kimi-outer: #3b93f7;
  --id-kimi-inner: #e27aeb;
  --sev-warn: #fbbf24;
  --sev-hot: #f87171;
}

.quota-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
  transition: width 0.2s ease;
}

.quota-bar-fill.pv-claudeQuota.rg-outer { background: var(--id-claude-outer); }
.quota-bar-fill.pv-claudeQuota.rg-inner { background: var(--id-claude-inner); }
.quota-bar-fill.pv-codexQuota.rg-outer { background: var(--id-codex-outer); }
.quota-bar-fill.pv-codexQuota.rg-inner { background: var(--id-codex-inner); }
/* Spark is Codex-family quota shown only here, so it wears the Codex hues. */
.quota-bar-fill.pv-codexSparkQuota.rg-outer { background: var(--id-codex-outer); }
.quota-bar-fill.pv-codexSparkQuota.rg-inner { background: var(--id-codex-inner); }
.quota-bar-fill.pv-antigravityQuota.rg-outer { background: var(--id-antigravity-outer); }
.quota-bar-fill.pv-antigravityQuota.rg-inner { background: var(--id-antigravity-inner); }
.quota-bar-fill.pv-kimiQuota.rg-outer { background: var(--id-kimi-outer); }
.quota-bar-fill.pv-kimiQuota.rg-inner { background: var(--id-kimi-inner); }
/* Severity overrides identity exactly like on the coins: warn 60, hot 85. */
.quota-bar-fill.sev-warn { background: var(--sev-warn); }
.quota-bar-fill.sev-hot { background: var(--sev-hot); }

.content {
  flex: 1 1 auto;
  overflow-y: auto;
  min-height: 0;
  padding: 16px 18px 20px;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

.group {
  margin: 0 0 18px;
}

.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  padding: 0 2px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card {
  position: relative;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  width: 100%;
  min-height: 86px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.card-unfocusable {
  grid-template-columns: 28px minmax(0, 1fr);
  align-items: start;
}

.card-unfocusable .actions {
  grid-column: 2;
  min-width: 0;
  justify-content: flex-start;
}

/* Keyboard mode. The banner lives in the header and the digit badge is
   absolutely positioned, so entering the mode changes no card height and the
   user's scroll position survives the next one-second rebuild. */
.quick-banner {
  margin-top: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--surface-alt);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

.quick-banner[hidden] { display: none; }

.quick-banner.is-active {
  color: var(--text);
  background: color-mix(in srgb, var(--accent) 16%, transparent);
}

.quick-digit-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  background: var(--accent);
  color: #ffffff;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
